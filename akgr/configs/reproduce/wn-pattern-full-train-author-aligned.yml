schema_version: 1
experiment:
  name: repro-wn-pattern-full-train-author-aligned-c4
  dataset: WN18RR
  profile: full
  seed: 42
  condition: pattern
tokenizer:
  condition_delimiter: COND
data:
  max_answers: 32
  split_ratios: [0.8, 0.1, 0.1]
  reverse_edges: true
  max_attempts_per_record: 10000
  workers: 4
sampling:
  train_per_pattern: 8000
  valid_per_pattern: 128
  test_per_pattern: 128
augmentation:
  enabled: true
  splits: [train]
  source_patterns: [up, 3in, pni, pin, inp]
model:
  type: gpt2
  initialization: random
  n_layer: 6
  n_embd: 768
  n_head: 12
  n_positions: 1024
  n_ctx: 1024
  tie_word_embeddings: true
training:
  gradient_accumulation_steps: 1
  validation:
    every_epochs: 5
    batch_size: 16
    min_parse_ok: 0.90
    min_eos_rate: 0.98
  checkpoint:
    every_epochs: 5
    keep_last: 2
  unconditional:
    epochs: 50
    learning_rate: 5.0e-5
    micro_batch_size: 160
    effective_batch_size: 160
    data_variant: merged
    optimizer:
      name: adam
      betas: [0.9, 0.999]
      eps: 1.0e-8
      weight_decay: 0.0
    scheduler:
      name: linear_warmup_constant
      warmup_unit: optimizer_step
      warmup_value: 5
      start_factor: 0.1
  conditional:
    epochs: 50
    learning_rate: 5.0e-5
    micro_batch_size: 160
    effective_batch_size: 160
    data_variant: base
    optimizer:
      name: adam
      betas: [0.9, 0.999]
      eps: 1.0e-8
      weight_decay: 0.0
    scheduler:
      name: linear_warmup_constant
      warmup_unit: optimizer_step
      warmup_value: 5
      start_factor: 0.1
generation:
  do_sample: true
  top_k: 0
  top_p: 1.0
  temperature: 1.0
  max_new_tokens: 33
grpo:
  num_generations: 4
  per_device_train_batch_size: 32
  epochs: 1
  learning_rate: 1.0e-5
  beta: 0.1
  epsilon: 0.2
  max_completion_length: 33
  save_steps: 100
  save_total_limit: 2
  report_to: []
  data_variant: base
  reward_weights:
    jaccard: 1.0
    dice: 0.5
    overlap: 0.5
    condition: 1.0
