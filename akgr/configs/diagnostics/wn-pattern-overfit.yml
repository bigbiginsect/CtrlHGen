schema_version: 1
experiment:
  name: diagnostic-wn-pattern-overfit-v5
  dataset: WN18RR
  profile: diagnostic
  seed: 42
  condition: pattern
tokenizer:
  condition_delimiter: COND
data:
  max_answers: 32
  split_ratios: [0.8, 0.1, 0.1]
  reverse_edges: true
  max_attempts_per_record: 10000
  workers: 4
sampling:
  train_per_pattern: 8
  valid_per_pattern: 2
  test_per_pattern: 2
augmentation:
  enabled: true
  splits: [train]
  source_patterns: [up, 3in, pni, pin, inp]
model:
  type: gpt2
  initialization: random
  n_layer: 12
  n_embd: 768
  n_head: 12
  n_positions: 1024
  n_ctx: 1024
  tie_word_embeddings: true
training:
  gradient_accumulation_steps: 1
  validation:
    every_epochs: 5
    batch_size: 8
    min_parse_ok: 0.50
    min_eos_rate: 0.95
  checkpoint:
    every_epochs: 10
    keep_last: 2
  unconditional:
    epochs: 50
    warmup_epochs: 5
    learning_rate: 1.0e-4
    micro_batch_size: 8
    effective_batch_size: 8
    data_variant: base
  conditional:
    epochs: 100
    warmup_epochs: 10
    learning_rate: 1.0e-4
    micro_batch_size: 8
    effective_batch_size: 8
    data_variant: base
generation:
  do_sample: false
  top_k: 0
  top_p: 1.0
  temperature: 1.0
  max_new_tokens: 33
grpo:
  num_generations: 4
  per_device_train_batch_size: 4
  epochs: 1
  learning_rate: 1.0e-5
  beta: 0.1
  epsilon: 0.2
  max_completion_length: 33
  save_steps: 10
  save_total_limit: 2
  report_to: []
  data_variant: base
  reward_weights:
    jaccard: 1.0
    dice: 0.5
    overlap: 0.5
    condition: 1.0
